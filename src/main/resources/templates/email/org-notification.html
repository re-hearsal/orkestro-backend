<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{emailTitle}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f0f4ff;font-family:'Segoe UI',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f4ff;padding:32px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

                <!-- Header -->
                <tr>
                    <td align="center" style="padding-bottom:24px;">
                        <table cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="background-color:#0f3eb5;border-radius:12px;padding:10px 24px;">
                                    <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:1px;">Orkestro</span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Card -->
                <tr>
                    <td style="background-color:#ffffff;border-radius:16px;border:1px solid #c5d3f5;padding:32px 36px;">

                        <!-- Title -->
                        <p style="margin:0 0 20px 0;font-size:18px;font-weight:700;color:#0f3eb5;line-height:1.3;">
                            {{emailTitle}}
                        </p>

                        <!-- Divider -->
                        <hr style="border:none;border-top:1px solid #e8eeff;margin:0 0 20px 0;">

                        <!-- Message text -->
                        <p style="margin:0 0 24px 0;font-size:15px;color:#1a1a2e;line-height:1.6;white-space:pre-wrap;">{{text}}</p>

                        <!-- Meta info block -->
                        <table width="100%" cellpadding="0" cellspacing="0"
                               style="background-color:#f7f9ff;border-radius:10px;border:1px solid #e0e8ff;">
                            <tr>
                                <td style="padding:16px 20px;">
                                    <table width="100%" cellpadding="0" cellspacing="4">
                                        <tr>
                                            <td style="font-size:13px;font-weight:700;color:#3d5a99;white-space:nowrap;padding-right:10px;padding-bottom:6px;">
                                                {{authorLabel}}
                                            </td>
                                            <td style="font-size:13px;color:#1a1a2e;padding-bottom:6px;">
                                                {{authorName}}
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="font-size:13px;font-weight:700;color:#3d5a99;white-space:nowrap;padding-right:10px;padding-bottom:6px;">
                                                {{organizationLabel}}
                                            </td>
                                            <td style="font-size:13px;color:#1a1a2e;padding-bottom:6px;">
                                                {{organizationName}}
                                            </td>
                                        </tr>
                                        {{#hasSection}}
                                        <tr>
                                            <td style="font-size:13px;font-weight:700;color:#3d5a99;white-space:nowrap;padding-right:10px;">
                                                {{sectionLabel}}
                                            </td>
                                            <td style="font-size:13px;color:#1a1a2e;">
                                                {{sectionName}}
                                            </td>
                                        </tr>
                                        {{/hasSection}}
                                    </table>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center" style="padding-top:20px;">
                        <p style="margin:0;font-size:12px;color:#9aa5c0;">
                            Orkestro &mdash; платформа для творческих коллективов
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
