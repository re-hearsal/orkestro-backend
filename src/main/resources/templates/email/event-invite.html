<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <title>{{emailTitle}}</title>
</head>
<body>
<p>{{text}}</p>
<p>
    <b>{{organizationLabel}}</b> {{organizationName}}<br/>
    <b>{{eventLabel}}</b> {{eventTitle}}
</p>
{{#includeRsvpForm}}
    <p>
        <a href="{{attendUrl}}" style="display:inline-block;padding:10px 16px;background:#16a34a;color:#fff;text-decoration:none;border-radius:6px;">{{attendButtonLabel}}</a>
        &nbsp;
        <a href="{{absentUrl}}" style="display:inline-block;padding:10px 16px;background:#dc2626;color:#fff;text-decoration:none;border-radius:6px;">{{absentButtonLabel}}</a>
    </p>
{{/includeRsvpForm}}
{{#hasEventLink}}
    <p>
        <a href="{{eventLink}}" style="display:inline-block;padding:10px 16px;background:#0f3eb5;color:#fff;text-decoration:none;border-radius:6px;">{{viewEventButtonLabel}}</a>
    </p>
{{/hasEventLink}}
</body>
</html>
