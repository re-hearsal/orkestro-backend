spring.application.name=Orkestro

# Liquibase changelog
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=pgpwd
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MinIO (значения по умолчанию можно переопределить через переменные окружения)
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:orkestro}

jwt.secret=${JWT_SECRET:secret}
jwt.expiration=${JWT_EXPIRATION:360000}

logging.level.liquibase=INFO
logging.level.org.springframework.liquibase=INFO

orkestro.telegram.queue-name=${TELEGRAM_RABBITMQ_QUEUE:telegram_notification_registrations}
orkestro.telegram.bot-message-queue-name=${TELEGRAM_RABBITMQ_OUT_QUEUE:telegram_bot_messages}
orkestro.telegram.event-rsvp-queue-name=${TELEGRAM_RABBITMQ_EVENT_RSVP_QUEUE:telegram_event_rsvp}

# Rabbit contract values (bot <-> backend)
orkestro.telegram.contract.type.telegram-link=${TELEGRAM_CONTRACT_TYPE_TELEGRAM_LINK:telegram.link}
orkestro.telegram.contract.type.event-rsvp=${TELEGRAM_CONTRACT_TYPE_EVENT_RSVP:event.rsvp}

# Telegram reply messages (backend -> bot)
orkestro.telegram.messages.link.invalid-request=${TELEGRAM_MSG_LINK_INVALID_REQUEST:Не удалось подключить Telegram-уведомления: данные запроса некорректны.}
orkestro.telegram.messages.link.token-not-found=${TELEGRAM_MSG_LINK_TOKEN_NOT_FOUND:Не удалось подключить Telegram-уведомления: ссылка недействительна. Сгенерируйте новую ссылку в личном кабинете приложения.}
orkestro.telegram.messages.link.token-already-used=${TELEGRAM_MSG_LINK_TOKEN_ALREADY_USED:Ссылка для подключения Telegram-уведомлений уже была использована. Сгенерируйте новую ссылку в личном кабинете приложения.}
orkestro.telegram.messages.link.token-expired=${TELEGRAM_MSG_LINK_TOKEN_EXPIRED:Ссылка для подключения Telegram-уведомлений истекла. Пожалуйста, сгенерируйте новую ссылку в личном кабинете приложения.}
orkestro.telegram.messages.link.telegram-already-linked=${TELEGRAM_MSG_LINK_TELEGRAM_ALREADY_LINKED:Этот Telegram-аккаунт уже привязан к другому пользователю. Если вы считаете это ошибкой, обратитесь к администратору.}
orkestro.telegram.messages.link.success=${TELEGRAM_MSG_LINK_SUCCESS:✅ Telegram-уведомления успешно подключены к вашему аккаунту.}
orkestro.telegram.messages.link.server-error=${TELEGRAM_MSG_LINK_SERVER_ERROR:Не удалось подключить Telegram-уведомления из-за ошибки сервера. Попробуйте позже.}

orkestro.telegram.messages.rsvp.invalid-request=${TELEGRAM_MSG_RSVP_INVALID_REQUEST:Не удалось сохранить ответ: данные запроса некорректны.}
orkestro.telegram.messages.rsvp.unknown-decision=${TELEGRAM_MSG_RSVP_UNKNOWN_DECISION:Не удалось сохранить ответ: неизвестное значение решения.}
orkestro.telegram.messages.rsvp.user-not-found=${TELEGRAM_MSG_RSVP_USER_NOT_FOUND:Не удалось сохранить ответ: пользователь не найден.}
orkestro.telegram.messages.rsvp.participant-not-found=${TELEGRAM_MSG_RSVP_PARTICIPANT_NOT_FOUND:Не удалось сохранить ответ: вы не являетесь участником этого события.}
orkestro.telegram.messages.rsvp.success=${TELEGRAM_MSG_RSVP_SUCCESS:✅ Ваш ответ по участию в событии сохранён.}
orkestro.telegram.messages.rsvp.server-error=${TELEGRAM_MSG_RSVP_SERVER_ERROR:Не удалось сохранить ответ из-за ошибки сервера. Попробуйте позже.}

# Static instrument icons (frontend assets)
orkestro.instrument.icon-url-prefix=/img/instruments/
orkestro.instrument.icon-url-suffix=.svg
