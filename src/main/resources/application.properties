spring.application.name=Orkestro

# Liquibase changelog
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=pgpwd
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MinIO (значения по умолчанию можно переопределить через переменные окружения)
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:orkestro}

jwt.secret=${JWT_SECRET:secret}
jwt.expiration=${JWT_EXPIRATION:360000}

logging.level.liquibase=INFO
logging.level.org.springframework.liquibase=INFO

orkestro.telegram.queue-name=${TELEGRAM_RABBITMQ_QUEUE:telegram_notification_registrations}
orkestro.telegram.bot-message-queue-name=${TELEGRAM_RABBITMQ_OUT_QUEUE:telegram_bot_messages}