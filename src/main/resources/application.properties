spring.application.name=Orkestro
spring.config.import=optional:file:.env[.properties]
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Liquibase changelog
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=pgpwd
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MinIO (значения по умолчанию можно переопределить через переменные окружения)
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:orkestro}

jwt.secret=${JWT_SECRET:secret}
jwt.expiration=${JWT_EXPIRATION:360000}

logging.level.liquibase=INFO
logging.level.org.springframework.liquibase=INFO

orkestro.telegram.queue-name=${TELEGRAM_RABBITMQ_QUEUE:telegram_notification_registrations}
orkestro.telegram.bot-message-queue-name=${TELEGRAM_RABBITMQ_OUT_QUEUE:telegram_bot_messages}
orkestro.telegram.event-rsvp-queue-name=${TELEGRAM_RABBITMQ_EVENT_RSVP_QUEUE:telegram_event_rsvp}
orkestro.email.queue-name=${EMAIL_RABBITMQ_QUEUE:email_notifications}
orkestro.vk.queue-name=${VK_RABBITMQ_QUEUE:vk_notification_registrations}
orkestro.vk.bot-message-queue-name=${VK_RABBITMQ_OUT_QUEUE:vk_notification_queue}
orkestro.vk.link.secret=${VK_LINK_SECRET:${JWT_SECRET:secret}}
orkestro.vk.link.ttl-minutes=${VK_LINK_TTL_MINUTES:60}

orkestro.mail.from=${SMTP_FROM}
orkestro.mail.host=${SMTP_HOST}
orkestro.mail.port=${SMTP_PORT}
orkestro.mail.username=${SMTP_USERNAME}
orkestro.mail.password=${SMTP_PASSWORD}
orkestro.mail.properties.mail.smtp.auth=${SMTP_AUTH}
orkestro.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS}
orkestro.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
orkestro.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
orkestro.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}
orkestro.email.rsvp.base-url=${EMAIL_RSVP_BASE_URL:http://localhost:8080}
orkestro.email.rsvp.secret=${EMAIL_RSVP_SECRET:${JWT_SECRET:secret}}
orkestro.email.rsvp.ttl-minutes=${EMAIL_RSVP_TTL_MINUTES:10080}

# Rabbit contract values (bot <-> backend)
orkestro.telegram.contract.type.telegram-link=${TELEGRAM_CONTRACT_TYPE_TELEGRAM_LINK:telegram.link}
orkestro.telegram.contract.type.event-rsvp=${TELEGRAM_CONTRACT_TYPE_EVENT_RSVP:event.rsvp}
orkestro.telegram.link.secret=${TELEGRAM_LINK_SECRET:${JWT_SECRET:secret}}
orkestro.telegram.link.ttl-minutes=${TELEGRAM_LINK_TTL_MINUTES:60}

# Static instrument icons (frontend assets)
orkestro.instrument.icon-url-prefix=/img/instruments/
orkestro.instrument.icon-url-suffix=.svg

# File attachment limits by entity
orkestro.limits.event-max-files=50
orkestro.limits.task-max-files=50
orkestro.limits.song-max-files=50
orkestro.limits.organization-max-files=100
