spring.datasource.url=jdbc:tc:postgresql:15:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=test-bucket

jwt.secret=test-secret-key-for-testing-purposes-only
jwt.expiration=3600000

orkestro.mail.from=test@example.com
orkestro.mail.host=localhost
orkestro.mail.port=25
orkestro.mail.username=test
orkestro.mail.password=test
orkestro.mail.properties.mail.smtp.auth=false
orkestro.mail.properties.mail.smtp.starttls.enable=false
orkestro.mail.properties.mail.smtp.connectiontimeout=1000
orkestro.mail.properties.mail.smtp.timeout=1000
orkestro.mail.properties.mail.smtp.writetimeout=1000

spring.mail.host=localhost
spring.mail.port=25

orkestro.telegram.queue-name=telegram_notification_registrations
orkestro.telegram.bot-message-queue-name=telegram_bot_messages
orkestro.telegram.event-rsvp-queue-name=telegram_event_rsvp
orkestro.email.queue-name=email_notifications
orkestro.vk.queue-name=vk_notification_registrations
orkestro.vk.bot-message-queue-name=vk_notification_queue

orkestro.vk.link.secret=test-vk-secret
orkestro.vk.link.ttl-minutes=60

orkestro.email.rsvp.base-url=http://localhost:8080
orkestro.email.rsvp.secret=test-rsvp-secret
orkestro.email.rsvp.ttl-minutes=10080

# Telegram contract
orkestro.telegram.contract.type.telegram-link=telegram.link
orkestro.telegram.contract.type.event-rsvp=event.rsvp
orkestro.telegram.link.secret=test-telegram-secret
orkestro.telegram.link.ttl-minutes=60

orkestro.instrument.icon-url-prefix=/img/instruments/
orkestro.instrument.icon-url-suffix=.svg

orkestro.limits.event-max-files=50
orkestro.limits.task-max-files=50
orkestro.limits.song-max-files=50
